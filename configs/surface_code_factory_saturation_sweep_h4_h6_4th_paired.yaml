experiment: fixed_circuit_factory_saturation_sweep_paired_precision
schema_version: 1

source:
  results_csv: artifacts/surface_code_grid_capacity_sweep_h4_h7_4th/results.csv
  topology_name: aware_10x10
  pf_label: 4th(new_2)

topology_manifest: configs/topologies/factory_saturation_h4_h6_4th/factory_saturation_manifest.json

molecules:
  - H4
  - H5
  - H6

rotation_precisions:
  - 1.0e-5
  - 1.0e-2

factory_counts:
  - 4
  - 6
  - 8

fixed_conditions:
  baseline_factory_count: 4
  comparison_factory_count: 8
  grid_size: [10, 10]
  machine_type: Dim2
  factory_plus_ban_cell_count: 8
  usable_non_factory_cells: 92
  inactive_factory_policy: replace_with_ban
  required_minimum_free_egress_per_active_factory: 1
  magic_generation_period: 15
  maximum_magic_state_stock: 10000
  entanglement_generation_period: 100
  maximum_entangled_state_stock: 10
  reaction_time: 1
  physical_error_rate: 0.001
  drop_rate: 0.1
  code_cycle_time_sec: 0.000001
  allowed_failure_prob: 0.01

comparison_policy:
  compare_within_precision: true
  compare_absolute_runtime_across_precision: false
  h7_policy: run_only_if_h4_h6_leave_factory_saturation_unresolved
  h7_trigger_runtime_change_pct: 1.0

execution:
  case_parallelism: 6
  aggregate_memory_high: 32G
  aggregate_memory_max: 40G

primary_metrics:
  - runtime
  - runtime_change_vs_four_factories
  - runtime_change_vs_eight_factories
  - runtime_without_topology

secondary_metrics:
  - qubit_volume
  - code_distance
  - physical_qubits
  - chip_cells
  - weighted_nearest_factory_distance

output_directory: artifacts/surface_code_factory_saturation_sweep_h4_h6_4th_paired
