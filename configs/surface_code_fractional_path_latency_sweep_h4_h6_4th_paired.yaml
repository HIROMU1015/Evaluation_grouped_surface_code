experiment: fixed_circuit_dim2_fractional_path_latency
schema_version: 1

source:
  results_csv: artifacts/surface_code_grid_capacity_sweep_h4_h7_4th/results.csv
  topology_name: aware_10x10
  pf_label: 4th(new_2)

placement_manifest: configs/topologies/logical_placement_h4_h7/placement_manifest.json
routing_manifest: configs/topologies/routing_capacity_h4_h7_4th/routing_capacity_manifest.json
diagnostic_patch: docs/benchmarks/qret_dim2_fractional_path_latency.patch

molecules: [H4, H5, H6]
rotation_precisions: [1.0e-5, 1.0e-2]
fixed_latency_model: fixed

latency_models:
  fixed: {numerator: 0, denominator: 1}
  quarter: {numerator: 1, denominator: 4}
  half: {numerator: 1, denominator: 2}
  unit: {numerator: 1, denominator: 1}

stages:
  screening:
    molecules: [H4]
    latency_models: [fixed, quarter, half, unit]
  replication:
    molecules: [H5, H6]
    latency_models: [fixed, quarter, unit]

families:
  placement:
    reference: compact
    conditions: [compact, intermediate, perimeter]
  routing:
    reference: remote
    conditions: [remote, moderate, choke]

fixed_conditions:
  magic_generation_period: 15
  maximum_magic_state_stock: 10000
  entanglement_generation_period: 100
  maximum_entangled_state_stock: 10
  reaction_time: 1

execution:
  case_parallelism: 4
  state_buffer_width: 256
  aggregate_memory_high: 32G
  aggregate_memory_max: 40G

output_directory: artifacts/surface_code_fractional_path_latency_sweep_h4_h6_4th_paired
