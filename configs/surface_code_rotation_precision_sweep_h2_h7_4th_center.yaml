targets:
  molecules:
    - H2
    - H3
    - H4
    - H5
    - H6
    - H7
  pf_labels:
    - 4th(new_2)

target_error: 0.00015936001019904
rotation_precision:
qret_path:

defaults:
  circuit_scope: efficient_controlled_pf_one_step
  compile_mode: ftqc_compile_topology_qec
  topology: factory_center_block
  machine_type: Dim2
  magic_generation_period: 15
  maximum_magic_state_stock:
    policy: fixed
    value: 10000
  entanglement_generation_period: 100
  maximum_entangled_state_stock: 10
  reaction_time: 1
  skip_compile_output: true

qec:
  physical_error_rate: 0.001
  drop_rate: 0.1
  code_cycle_time_sec: 0.000001
  allowed_failure_prob: 0.01

topologies:
  factory_center_block:
    enabled: true
    path: configs/topologies/tutorial_factory_center_block.yaml

architecture_cases:
  - name: rot_prec_1e-5_baseline
    topology: factory_center_block
    rotation_precision: 1.0e-5

  - name: rot_prec_3e-5
    topology: factory_center_block
    rotation_precision: 3.0e-5

  - name: rot_prec_1e-4
    topology: factory_center_block
    rotation_precision: 1.0e-4

  - name: rot_prec_3e-4
    topology: factory_center_block
    rotation_precision: 3.0e-4

  - name: rot_prec_1e-3
    topology: factory_center_block
    rotation_precision: 1.0e-3

output:
  directory: artifacts/surface_code_rotation_precision_sweep_h2_h7_4th_center
  jsonl: results.jsonl
  csv: results.csv
  markdown: results.md

cache:
  reuse_compile_results: true
